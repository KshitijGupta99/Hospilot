<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Hospilot — Database RAG Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc; color: #0f172a; min-height: 100vh;
      display: flex; flex-direction: column;
    }

    header {
      background: #0f172a; color: white; padding: 20px 32px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #334155;
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: white;
    }
    .brand-title { font-size: 18px; font-weight: 700; }
    .brand-subtitle { font-size: 12px; color: #94a3b8; }

    main {
      flex: 1; max-width: 1000px; width: 100%; margin: 32px auto; padding: 0 20px;
      display: flex; flex-direction: column; gap: 24px;
    }

    .card {
      background: white; border: 1px solid #e2e8f0; border-radius: 16px;
      padding: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .input-section { display: flex; flex-direction: column; gap: 14px; }
    .input-label { font-size: 14px; font-weight: 600; color: #334155; }
    .search-box-row { display: flex; gap: 12px; }
    .question-input {
      flex: 1; padding: 14px 18px; border-radius: 12px; border: 1px solid #cbd5e1;
      font-size: 15px; outline: none; font-family: inherit; transition: all 0.15s;
    }
    .question-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }

    .btn-ask {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: white; border: none; padding: 14px 28px; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-ask:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-ask:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }

    .samples-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
    .chip-label { font-size: 12px; color: #64748b; font-weight: 500; }
    .chip {
      background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0;
      padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .chip:hover { background: #eff6ff; color: #3b82f6; border-color: #bfdbfe; }

    /* Results Section */
    .results-container { display: flex; flex-direction: column; gap: 20px; }
    
    .answer-card {
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 14px; padding: 20px;
    }
    .answer-card.unsupported {
      background: #fffbebfb; border-color: #fde68a;
    }
    .answer-title { font-size: 13px; font-weight: 700; color: #166534; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .answer-card.unsupported .answer-title { color: #b45309; }
    .answer-text { font-size: 15px; line-height: 1.6; color: #1e293b; white-space: pre-line; }

    .reasoning-card {
      background: #0f172a; color: #f8fafc; border-radius: 14px; padding: 20px;
    }
    .section-header { font-size: 13px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    
    .sql-code-block {
      background: #1e293b; color: #38bdf8; padding: 14px; border-radius: 8px;
      font-family: 'Courier New', Courier, monospace; font-size: 13px;
      overflow-x: auto; line-height: 1.5; border: 1px solid #334155;
    }

    .table-wrapper { overflow-x: auto; margin-top: 8px; border-radius: 10px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #f1f5f9; color: #475569; font-weight: 600; padding: 10px 14px; border-bottom: 1px solid #e2e8f0; }
    td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; color: #334155; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="header-brand">
      <div class="brand-logo">💬</div>
      <div>
        <div class="brand-title">Ask Hospilot</div>
        <div class="brand-subtitle">Natural Language Hospital Database RAG Assistant</div>
      </div>
    </div>
  </header>

  <main>
    <div class="card input-section">
      <label class="input-label" for="question">Ask a question about hospital operations or database metrics:</label>
      <div class="search-box-row">
        <input id="question" class="question-input" type="text" placeholder="e.g. How many ICU beds are available right now?" onkeydown="if(event.key==='Enter') sendQuestion()">
        <button id="ask-btn" class="btn-ask" onclick="sendQuestion()">
          <span>🔍</span> Ask Hospilot
        </button>
      </div>

      <div class="samples-row">
        <span class="chip-label">Try asking:</span>
        <button class="chip" onclick="useSample('How many ICU beds are available right now?')">ICU Bed Availability</button>
        <button class="chip" onclick="useSample('Which wards have the highest bed occupancy right now?')">Highest Occupancy Wards</button>
        <button class="chip" onclick="useSample('how are beds doing?')">Broad Bed Overview</button>
        <button class="chip" onclick="useSample('Which wards are short-staffed tonight?')">Short-Staffed Wards</button>
        <button class="chip" onclick="useSample('What is our average patient satisfaction rating this month?')">Unsupported Question Test</button>
      </div>
    </div>

    <!-- Output Section -->
    <div id="results-container" class="results-container" style="display: none;">
      <!-- Answer Card -->
      <div id="answer-card" class="answer-card">
        <div id="answer-title" class="answer-title">
          <span>✨</span> Grounded Answer
        </div>
        <div id="answer-text" class="answer-text"></div>
      </div>

      <!-- Generated SQL -->
      <div class="reasoning-card">
        <div class="section-header">
          <span>⚡</span> Generated SQL (Reasoning Mechanism)
        </div>
        <pre id="sql-block" class="sql-code-block"></pre>
      </div>

      <!-- Retrieved Data Rows -->
      <div class="card">
        <div class="section-header" style="color: #475569;">
          <span>📊</span> Retrieved Database Rows (<span id="row-count">0</span>)
        </div>
        <div class="table-wrapper">
          <table id="rows-table">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
    function useSample(q) {
      document.getElementById('question').value = q;
      sendQuestion();
    }

    async function sendQuestion() {
      const qInput = document.getElementById('question');
      const question = qInput.value.trim();
      if (!question) return;

      const askBtn = document.getElementById('ask-btn');
      const resultsContainer = document.getElementById('results-container');
      const answerCard = document.getElementById('answer-card');
      const answerText = document.getElementById('answer-text');
      const sqlBlock = document.getElementById('sql-block');
      const tableHead = document.getElementById('table-head');
      const tableBody = document.getElementById('table-body');
      const rowCount = document.getElementById('row-count');

      askBtn.disabled = true;
      askBtn.innerHTML = '<span class="spinner"></span> Querying...';

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();

        resultsContainer.style.display = 'flex';
        
        // Formatted Markdown-like simple bold text replacement
        let formattedAnswer = data.answer || "No response received.";
        formattedAnswer = formattedAnswer.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        // Check if unanswerable/refusal response
        if (data.answer && data.answer.includes("can't answer that from the available hospital data")) {
          answerCard.className = "answer-card unsupported";
          document.getElementById('answer-title').innerHTML = "⚠️ Metrics Unavailable in Schema";
        } else {
          answerCard.className = "answer-card";
          document.getElementById('answer-title').innerHTML = "✨ Grounded Answer";
        }

        answerText.innerHTML = formattedAnswer;
        sqlBlock.innerText = data.sql || "-- No SQL generated";

        // Render Table Rows
        const rows = data.rows || [];
        rowCount.innerText = rows.length;

        tableHead.innerHTML = '';
        tableBody.innerHTML = '';

        if (rows.length > 0) {
          const keys = Object.keys(rows[0]);
          let headHtml = '<tr>' + keys.map(k => `<th>${k}</th>`).join('') + '</tr>';
          tableHead.innerHTML = headHtml;

          let bodyHtml = rows.map(r => {
            return '<tr>' + keys.map(k => `<td>${r[k] !== null ? r[k] : ''}</td>`).join('') + '</tr>';
          }).join('');
          tableBody.innerHTML = bodyHtml;
        } else {
          tableBody.innerHTML = '<tr><td colspan="100%" style="text-align:center; color:#94a3b8; padding:20px;">No matching rows returned from database.</td></tr>';
        }

      } catch (err) {
        alert("Error connecting to Ask Hospilot service: " + err.message);
      } finally {
        askBtn.disabled = false;
        askBtn.innerHTML = '<span>🔍</span> Ask Hospilot';
      }
    }
  </script>
</body>
</html>
